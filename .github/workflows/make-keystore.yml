name: Make signing key (run ONCE)
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: Check the password secret exists
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "Add the KEYSTORE_PASSWORD secret first"; exit 1; fi
      - name: Create keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -alias forge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Forge Gym, O=Forge, C=PK"
          base64 -w0 release.jks > KEYSTORE_BASE64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signing-key-SAVE-THIS-PRIVATELY
          path: |
            release.jks
            KEYSTORE_BASE64.txt
